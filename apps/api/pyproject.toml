[project]
name = "tx-trade-api"
version = "1.1.4"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "openai>=1.90",
  "PyJWT[crypto]>=2.10",
  "cryptography>=46",
  "websockets>=15",
  # Windows has no IANA time zone database; zoneinfo reads it from this package.
  "tzdata>=2024.1; sys_platform == 'win32'",
  "anthropic>=1",
]

[project.optional-dependencies]
migration = ["psycopg[binary]>=3.2,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_helper"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
